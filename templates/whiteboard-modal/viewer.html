<div id="whiteboard-modal" class="whiteboard-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="whiteboard-title">
    <!-- Barra Superior Flutuante de Ferramentas (Estilo Excalidraw) -->
    <div class="whiteboard-topbar">
      <div class="whiteboard-brand">
        <span class="whiteboard-icon">🎨</span>
        <span id="whiteboard-title" class="whiteboard-title">Lousa Colaborativa</span>
        <span id="whiteboard-sync-badge" class="whiteboard-sync-badge">P2P Sincronizado</span>
      </div>

      <div class="whiteboard-tools" id="whiteboard-tools-group">
        <button class="wb-tool-btn" data-tool="select" title="Mover / Selecionar (V)">👆</button>
        <button class="wb-tool-btn" data-tool="hand" title="Arrastar Tela / Pan (H ou Espaço+Arrastar)">🖐️</button>
        <button class="wb-tool-btn active" data-tool="pencil" title="Caneta Livre (P)">✏️</button>
        <div class="wb-shapes-group" id="wb-shapes-group">
          <button class="wb-tool-btn wb-shapes-trigger" id="wb-shapes-btn" type="button" title="Formas geométricas" aria-haspopup="menu" aria-expanded="false" aria-controls="wb-shapes-menu">
            <span class="wb-shapes-icon" aria-hidden="true">△</span> Formas <span aria-hidden="true">▾</span>
          </button>
          <div class="wb-shapes-menu" id="wb-shapes-menu" role="menu" aria-label="Formas geométricas" hidden>
            <button class="wb-tool-btn" data-tool="rectangle" role="menuitemradio" aria-checked="false" title="Retângulo (R)">▭<span>Retângulo</span></button>
            <button class="wb-tool-btn" data-tool="circle" role="menuitemradio" aria-checked="false" title="Círculo (C)">○<span>Círculo</span></button>
            <button class="wb-tool-btn" data-tool="triangle" role="menuitemradio" aria-checked="false" title="Triângulo">△<span>Triângulo</span></button>
            <button class="wb-tool-btn" data-tool="right-triangle" role="menuitemradio" aria-checked="false" title="Triângulo retângulo">◺<span>Triângulo retângulo</span></button>
            <button class="wb-tool-btn" data-tool="diamond" role="menuitemradio" aria-checked="false" title="Losango (D)">◇<span>Losango</span></button>
            <button class="wb-tool-btn" data-tool="hexagon" role="menuitemradio" aria-checked="false" title="Hexágono">⬡<span>Hexágono</span></button>
          </div>
        </div>
        <button class="wb-tool-btn" data-tool="arrow" title="Flecha (A)">➡️</button>
        <button class="wb-tool-btn" data-tool="line" title="Linha: arraste ou clique nos vértices; dois cliques finalizam (L)">📏</button>
        <button class="wb-tool-btn" data-tool="text" title="Escrever no ponto clicado (T ou dois cliques)">🔤</button>
        <button class="wb-tool-btn" data-tool="formula" title="Fórmula LaTeX (M)" aria-label="Fórmula LaTeX">∑</button>
        <button class="wb-tool-btn" data-tool="image" id="wb-image-btn" title="Inserir Imagem (I ou Ctrl+V)">🖼️</button>
        <button class="wb-tool-btn" data-tool="eraser" title="Borracha (E)">🧼</button>
        <input type="file" id="wb-image-input" accept="image/*" style="display: none;">
      </div>

      <div class="whiteboard-actions">
        <div class="wb-zoom-group" style="display: flex; align-items: center; gap: 2px;">
          <button id="wb-zoom-out-btn" class="wb-action-btn" title="Diminuir Zoom (-)">🔍−</button>
          <button id="wb-zoom-reset-btn" class="wb-action-btn" title="Resetar Visualização (100%)" style="min-width: 48px; font-weight: 600;">100%</button>
          <button id="wb-zoom-in-btn" class="wb-action-btn" title="Aumentar Zoom (+)">🔍+</button>
        </div>
        <button id="wb-undo-btn" class="wb-action-btn" title="Desfazer (Ctrl+Z)">↩️</button>
        <button id="wb-redo-btn" class="wb-action-btn" title="Refazer (Ctrl+Y)">↪️</button>
        <button id="wb-clear-btn" class="wb-action-btn" title="Limpar Lousa">🗑️</button>
        <button id="wb-export-btn" class="wb-action-btn primary" title="Baixar Imagem PNG">💾 Exportar</button>
        <button id="wb-chat-btn" class="wb-action-btn" title="Compartilhar no Chat">💬 Chat</button>
        <button id="wb-close-btn" class="wb-close-btn" title="Fechar Lousa" aria-label="Fechar Lousa">✕</button>
      </div>
    </div>

    <!-- Barra Lateral Flutuante de Estilos & Cores -->
    <div class="whiteboard-stylebar">
      <div class="wb-style-section">
        <label>Cor do Traço:</label>
        <div class="wb-color-palette" id="wb-stroke-palette">
          <button class="wb-color-dot active" data-color="#ffffff" style="background: #ffffff;"></button>
          <button class="wb-color-dot" data-color="#ef4444" style="background: #ef4444;"></button>
          <button class="wb-color-dot" data-color="#10b981" style="background: #10b981;"></button>
          <button class="wb-color-dot" data-color="#06b6d4" style="background: var(--accent);"></button>
          <button class="wb-color-dot" data-color="#a855f7" style="background: #a855f7;"></button>
          <button class="wb-color-dot" data-color="#f59e0b" style="background: #f59e0b;"></button>
          <button class="wb-color-dot" data-color="#ec4899" style="background: #ec4899;"></button>
          <button class="wb-color-dot" data-color="#1e1e2e" style="background: #1e1e2e; border: 1px solid #555;"></button>
        </div>
      </div>

      <div class="wb-style-section">
        <label>Espessura:</label>
        <div class="wb-button-group" id="wb-width-group">
          <button class="wb-opt-btn" data-width="2">Fina</button>
          <button class="wb-opt-btn active" data-width="4">Média</button>
          <button class="wb-opt-btn" data-width="8">Grossa</button>
        </div>
      </div>

      <div class="wb-style-section">
        <label>Preenchimento:</label>
        <div class="wb-button-group" id="wb-fill-group">
          <button class="wb-opt-btn active" data-fill="none">Vazio</button>
          <button class="wb-opt-btn" data-fill="semi">Semi</button>
          <button class="wb-opt-btn" data-fill="solid">Sólido</button>
        </div>
      </div>

      <div class="wb-style-section">
        <label>Traço Hand-drawn:</label>
        <div class="wb-button-group" id="wb-rough-group">
          <button class="wb-opt-btn active" data-rough="true">Rascunho</button>
          <button class="wb-opt-btn" data-rough="false">Preciso</button>
        </div>
      </div>

      <div class="wb-style-section">
        <label>Fundo:</label>
        <div class="wb-button-group" id="wb-bg-group">
          <button class="wb-opt-btn active" data-bg="dark">Dark Grid</button>
          <button class="wb-opt-btn" data-bg="light">Light Grid</button>
          <button class="wb-opt-btn" data-bg="transparent" title="Desenhar por cima do jogo ao vivo">Overlay</button>
        </div>
      </div>
    </div>

    <!-- Canvas Principal da Lousa -->
    <canvas id="whiteboard-canvas" class="whiteboard-canvas"></canvas>
    <p id="wb-tool-hint" class="wb-tool-hint">Dois cliques para escrever ou editar um texto</p>
  </div>
